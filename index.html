<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixels to Policy: Self-Guided Lesson</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5fb;--card:#fff;--tx:#1d1b2e;--mu:#625f78;--ac:#5b3fd9;--ac2:#e8e2ff;--ok:#14803c;--okbg:#dcf5e5;--bad:#b42318;--badbg:#fde4e1;--bd:#dcd8ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14121f;--card:#1f1c2e;--tx:#efedf9;--mu:#a9a5c4;--ac:#a894ff;--ac2:#2e2850;--ok:#6fdc99;--okbg:#17382a;--bad:#ff9a8f;--badbg:#44201d;--bd:#363152}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14121f;--card:#1f1c2e;--tx:#efedf9;--mu:#a9a5c4;--ac:#a894ff;--ac2:#2e2850;--ok:#6fdc99;--okbg:#17382a;--bad:#ff9a8f;--badbg:#44201d;--bd:#363152}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 10px;max-width:860px;margin:auto}
h1{font-size:1.5rem;margin:0}h2{margin:.2rem 0 .4rem}.sub{color:var(--mu);margin:.2rem 0}
#bar{height:8px;background:var(--ac2);border-radius:8px;margin-top:10px;overflow:hidden}#fill{height:100%;width:0;background:var(--ac);transition:width .3s}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:860px;margin:auto}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}nav button.done::after{content:" ✓";color:var(--ok)}nav button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:12px;padding:2px 10px;font-size:.8rem;font-weight:600}
.q{margin:14px 0;padding-bottom:12px;border-bottom:1px dashed var(--bd)}.q:last-child{border:0}
.q label{display:block;font-weight:600;margin-bottom:5px}
input[type=text],input[type=number],select,textarea{width:100%;max-width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
.fb{font-size:.9rem;margin-top:5px;min-height:1.2em}.ok .fb{color:var(--ok)}.no .fb{color:var(--bad)}
.ok input,.ok select,.ok textarea{border-color:var(--ok);background:var(--okbg)}.no input,.no select{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pc{background:var(--ac2);border-radius:12px;padding:12px;font-weight:600;margin:10px 0}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.chk input{margin-top:5px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;font:.85rem/1.4 ui-monospace,monospace}

.land img{width:100%;border-radius:14px;display:block}
.land h1{font-size:1.9rem;margin:14px 0 4px}.land .lead{font-size:1.05rem;color:var(--mu);margin:0 0 10px}
.chips span{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:14px;padding:3px 12px;font-size:.82rem;font-weight:600;margin:0 6px 6px 0}
.aim{border-left:5px solid var(--ac)}.aim .nb{font-weight:700;margin:2px 0}.aim .en{color:var(--mu);font-size:.92rem;margin:2px 0 6px}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}
.tl li:last-child{border:0}.tl .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.tl .tm{margin-left:auto;flex:none;color:var(--mu);font-size:.85rem;white-space:nowrap}
.big{font-size:1.1rem;padding:14px 28px}
.vr{display:grid;grid-template-columns:minmax(130px,30%) 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}@media(max-width:560px){.vr{grid-template-columns:1fr;gap:2px}}
details.vs{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}details.vs summary{cursor:pointer;padding:4px 0}
</style></head><body>

var VOC=`## 1. The video game industry and careers
AAA game :: A game produced with a large budget and substantial development resources.
Animator :: A person who makes characters and objects move.
Composer :: A person who writes music for a game.
Deadline :: The date or time by which a task must be completed.
Game artist :: A person who creates the visual elements of a game.
Game designer :: A person who plans how a game works, including its rules, mechanics and player experience.
Game developer :: A person or company that creates video games.
Game jam :: An event where participants create a game within a limited time.
Game programmer :: A person who writes code that makes a game function.
Game producer :: A person who coordinates the development team, schedule, resources and progress.
Game studio :: A company or team that develops video games.
Indie game :: A game developed independently, often by a small team or individual.
Level designer :: A person who creates the environments, challenges and layouts of game levels.
Narrative designer :: A person who designs the story, dialogue and narrative experience of a game.
Playtest :: A session in which people play a game so developers can evaluate it.
Portfolio :: A collection of work that demonstrates a person's skills and experience.
Publisher :: A company that helps finance, market and distribute a game.
Quality assurance (QA) tester :: A person who tests a game to find bugs and other problems.
Sound designer :: A person who creates or selects sounds and audio effects for a game.
Video game industry :: The businesses and professionals who create, publish, sell and support video games.
## 2. Game design and gameplay
Accessibility :: Design choices that make a game usable by people with different needs and abilities.
Balancing :: Adjusting game mechanics so that the game is fair and enjoyable.
Checkpoint :: A point where progress is saved so the player can resume from there.
Collision detection :: The process of determining whether objects touch or overlap.
Difficulty :: How challenging a game is to play.
Difficulty curve :: The way a game's challenge increases or changes over time.
Game loop :: A repeated sequence of actions that forms the core of gameplay.
Game mechanics :: The rules and systems that determine how a game works.
Gameplay :: The way a player interacts with and experiences a game.
Hitbox :: An invisible shape used to detect collisions or whether an attack hits something.
Inventory :: A menu or system for storing and managing items.
Level :: A stage or section of a game, often with its own challenges.
Level design :: The process of planning and creating playable stages or environments.
Mission :: A specific objective or assignment within a game.
Objective :: Something the player is trying to achieve.
Player experience (PX) :: The overall experience a player has while playing a game.
Power-up :: An item or effect that temporarily improves a character's abilities.
Power-up system :: A set of mechanics that lets players gain temporary advantages.
Progression :: The way players advance through a game or develop their abilities.
Replayability :: The extent to which a game remains enjoyable to play again.
Respawn :: To appear again in the game after being defeated or eliminated.
Save point :: A location or feature that allows the player to save progress.
Tutorial :: Instructions that teach players how to play.
User experience (UX) :: How easy, effective and enjoyable a game or interface is to use.
User interface (UI) :: The visual controls and menus through which players interact with a game.
## 3. Game genres and types
Action game :: A game that focuses on physical challenges, quick reactions and combat or movement.
Adventure game :: A game that focuses on exploration, puzzles and story.
Battle royale :: A game mode in which many players compete until one player or team remains.
Casual game :: A game that is generally easy to learn and play in short sessions.
Co-op game :: A game in which players cooperate to achieve shared goals.
Competitive game :: A game in which players or teams compete against one another.
First-person shooter (FPS) :: A shooting game viewed through the main character's eyes.
Genre :: A category of games with similar characteristics.
Horror game :: A game designed to create fear, suspense or tension.
Massively multiplayer online game (MMO) :: An online game that supports a very large number of players in a shared world.
Mobile game :: A game designed for mobile devices such as smartphones and tablets.
Multiplayer game :: A game played by more than one person.
Open-world game :: A game with a large environment that players can explore relatively freely.
Platformer :: A game in which players jump between platforms and overcome obstacles.
Puzzle game :: A game based on solving problems, patterns or logical challenges.
Racing game :: A game in which players compete using vehicles or other forms of transport.
Role-playing game (RPG) :: A game in which players develop characters and often make decisions that affect the story.
Sandbox game :: A game that gives players considerable freedom to explore and create.
Serious game :: A game designed partly or primarily for purposes such as education, training or awareness.
Simulation game :: A game that imitates real-world activities or systems.
Single-player game :: A game designed primarily for one player.
Sports game :: A game based on sports such as football, basketball or racing.
Strategy game :: A game that requires planning, decision-making and resource management.
Survival game :: A game in which players must stay alive by managing threats and resources.
Third-person shooter :: A shooting game in which the player can see the character from outside.
## 4. Programming and technical development
Algorithm :: A sequence of steps used to solve a problem or perform a task.
API (application programming interface) :: A set of rules that allows different software systems to communicate.
Artificial intelligence (AI) :: Technology that enables computer systems to perform tasks associated with human intelligence.
Build :: A compiled or packaged version of a game that can be tested or released.
Bug :: An error or flaw that causes a program or game to behave incorrectly.
Code :: Instructions written in a programming language.
Compatibility :: The ability of software to work correctly with a particular device or system.
Cross-platform :: Available or playable across different hardware platforms.
Debugging :: The process of finding and fixing bugs.
Frame rate (FPS) :: The number of frames displayed each second.
Function :: A reusable block of code that performs a particular task.
Game engine :: Software used to build and run video games.
Glitch :: An unexpected error or behaviour in a game.
Latency :: The delay between an action and the system's response.
Minimum viable product (MVP) :: The simplest usable version of a product that can test its core idea.
Non-player character (NPC) :: A character controlled by the game rather than by a human player.
Optimization :: Improving performance while using resources efficiently.
Patch :: A software update that fixes bugs or changes features.
Physics engine :: Software that simulates movement, gravity, forces and collisions.
Porting :: Adapting a game so it can run on another platform.
Programming language :: A formal language used to write instructions for a computer.
Prototype :: An early, simplified version used to test an idea.
Rendering :: The process of generating an image from digital scene data.
Repository :: A place where project files and their revision history are stored.
Script :: A piece of code that controls an action or behaviour.
Source code :: The human-readable instructions that make up a program.
Update :: A new version that changes, improves or fixes software.
Variable :: A named place in a program where a value can be stored.
Version control :: A system for tracking changes to files and code over time.
Cloud gaming :: Playing games streamed from remote servers rather than running them entirely on a local device.
Git :: A version-control system used to track and manage changes in code.
## 5. Graphics, animation and visual effects
2D (two-dimensional) :: Visuals with height and width but no third spatial dimension.
3D (three-dimensional) :: Visuals representing height, width and depth.
Animation :: The process of creating the illusion of movement.
Art style :: The distinctive visual approach used in a game.
Asset :: A digital resource used in a game, such as a model, sound, texture or animation.
Character design :: The process of developing a character's appearance, personality and visual identity.
Concept art :: Early artwork used to explore ideas for characters, environments or objects.
Cutscene :: A non-interactive sequence used to tell a story or show an event.
Keyframe :: A frame that defines an important position or state in an animation.
Lighting :: The use of light and shadow to create atmosphere, depth and visibility.
Mesh :: A collection of connected vertices, edges and faces that forms a 3D object's shape.
Motion capture (mocap) :: Technology used to record real movements and transfer them to digital characters.
Particle system :: A system used to create effects from many small elements, such as sparks, rain or smoke.
Pixel art :: Digital artwork created using visible individual pixels as a deliberate style.
Resolution :: The number of pixels used to display an image.
Rigging :: Creating a digital skeleton and controls for an animated character.
Shading :: The process of determining how surfaces appear under lighting.
Texture :: An image or material property applied to a 3D model to give it surface detail.
3D modelling :: The process of creating digital three-dimensional objects.
User interface (UI) design :: The design of menus, icons, indicators and other on-screen controls.
Visual effects (VFX) :: Computer-generated effects such as explosions, smoke or magical energy.
## 6. Storytelling and characters
Antagonist :: A character or force that opposes the protagonist.
Backstory :: Events in a character's or world's history that happened before the main story.
Branching narrative :: A story in which choices can lead to different events or outcomes.
Character development :: The way a character changes or grows throughout a story.
Dialogue :: A conversation between characters.
Dialogue tree :: A structure that lets players select from different dialogue options.
Environmental storytelling :: Communicating information about the story through the setting, objects and surroundings.
Immersion :: The feeling of being deeply involved in a game's world or experience.
Lore :: Background information about a game's world, history and characters.
Moral dilemma :: A situation in which a character must choose between difficult or conflicting values.
Narrative :: The story or sequence of events in a game.
Player choice :: A decision made by the player that may affect gameplay or the story.
Plot :: The main sequence of events that forms a story.
Protagonist :: The main character in a story.
Voice acting :: The performance of dialogue by actors who provide characters' voices.
World-building :: The process of creating a believable fictional world, including its history, culture and rules.
## 7. Sound and music
Ambient sound :: Background audio that creates a sense of place, such as wind or traffic.
Audio mixing :: The process of balancing different sound elements.
Background music :: Music that plays behind the main action or dialogue.
Dubbing :: Replacing original spoken dialogue with recordings in another language.
Dynamic music :: Music that changes in response to gameplay or events.
Foley :: Everyday sounds recorded or created to match actions in a scene.
Localization :: Adapting a game for different languages and cultural contexts, including dialogue and on-screen text.
Sound effect (SFX) :: A sound used to represent an action or event, such as footsteps or an explosion.
Soundtrack :: The collection of music associated with a game.
Spatial audio :: Audio designed to give a sense of where sounds are coming from.
Subtitles :: Written text showing spoken dialogue or other relevant audio information.
Voice-over :: Spoken audio that provides narration or information.
## 8. Online gaming and esports
Anti-cheat system :: Software designed to detect or prevent cheating.
Cheat :: An unauthorized method of gaining an unfair advantage.
Clan / guild :: A group of players who play together regularly.
Community :: The group of players and fans connected to a game.
Disconnect :: To lose a connection to an online game or server.
Esports :: Organized competitive video gaming, often involving teams, leagues and tournaments.
Gaming etiquette :: Accepted standards of respectful behaviour when playing with others.
Griefing :: Deliberately ruining other players' experiences, often within the game's rules or through exploitation.
Lag :: A noticeable delay or interruption in a game's response.
Leaderboard :: A list showing players' scores or rankings.
Lobby :: A virtual waiting area where players gather before a match.
Matchmaking :: A system that finds other players for a game session.
Moderation :: The process of enforcing community rules and responding to harmful behaviour.
Ping :: A measurement, usually in milliseconds, of the response time between a device and a server.
Ranking :: A system that orders players according to performance or skill.
Server :: A computer or system that provides services or manages online game sessions.
Skill-based matchmaking :: A system that tries to match players with others of similar ability.
Spectator mode :: A mode that allows users to watch gameplay without actively playing.
Streamer :: A person who broadcasts live content online.
Toxic behaviour :: Abusive, hostile or deliberately disruptive behaviour toward other players.
Livestream :: A real-time broadcast over the internet.
## 9. Business, marketing and monetization
Age rating :: A classification that indicates the age group for which a game is considered suitable.
Art style :: The distinctive visual approach used in a game.
Battle pass :: A progression system that rewards players with items as they complete challenges, often during a limited season.
Business model :: The way a company creates value and earns money.
Copyright :: Legal protection for original creative work.
Cosmetic item :: An item that changes appearance without necessarily changing gameplay performance.
Downloadable content (DLC) :: Additional game content released separately from the main game.
Early access :: A release model that lets players buy or play a game before its full official release.
Expansion pack :: A larger addition that extends a game's content.
Free-to-play (F2P) :: A game that can be played without an initial purchase, often with optional purchases.
Hype :: Strong public excitement or anticipation about a product or event.
In-app purchase :: A purchase made inside an application or game.
In-game currency :: Virtual money used to buy items or services inside a game.
Intellectual property (IP) :: Creations such as characters, stories, artwork and code that may be legally protected.
Licensing :: Permission to use protected content under agreed conditions.
Loot box :: A virtual container that provides randomized rewards.
Market research :: Collecting information about customers, competitors and market demand.
Marketing campaign :: A planned set of activities used to promote a product.
Microtransaction :: A relatively small purchase made within a game.
Microtransaction economy :: The system of small purchases and virtual goods within a game.
Monetization :: The process of generating revenue from a game.
PEGI :: The Pan-European Game Information system used to provide age ratings and content descriptors for games in many European countries.
Premium game :: A game that requires payment to access the main product.
Pre-order :: An order placed before a product is officially released.
Release date :: The date a game becomes available to the public.
Return on investment (ROI) :: A measure of the financial return compared with the resources invested.
Subscription :: A payment made regularly for continued access to a service or content.
Target audience :: The group of people a product is designed to reach.
Trailer :: A short promotional video that presents a game.
## 10. Testing, feedback and quality assurance
Bug report :: A description of a problem, including steps to reproduce it and relevant details.
Continuous improvement :: An ongoing effort to make a product or process better.
Feedback :: Information or opinions about how well something works.
Iteration :: Repeating a cycle of development and improvement.
Performance testing :: Checking how well a game runs under different conditions.
Playability :: How well a game can be played in terms of controls, responsiveness and overall function.
Priority :: How urgently a problem should be addressed.
Quality assurance (QA) :: The process of checking that a game meets quality standards.
Regression testing :: Testing existing features again after changes to make sure they still work.
Reproduce a bug :: To make an error happen again by following the same steps.
Severity :: How serious the impact of a bug or problem is.
Stress testing :: Testing a system under heavy workloads or demanding conditions.
Test case :: A specific set of steps used to check a particular feature or behaviour.
Test environment :: The setup in which software is tested.
Usability testing :: Observing people using a product to identify problems and improve ease of use.
User acceptance testing (UAT) :: Testing to determine whether a product meets users' needs and requirements.
User feedback :: Comments and observations from people who play or use a game.
## 11. Hardware, platforms and performance
Backward compatibility :: The ability of newer hardware to run games designed for older systems.
Cloud computing :: The use of remote computing resources delivered over a network.
Console :: A dedicated electronic device designed primarily for playing games.
Controller :: A device used to control a game, often with buttons and joysticks.
Cross-play :: A feature that allows players on different platforms to play together.
Cross-progression :: A feature that lets a player's progress carry across supported platforms.
Frame drop :: A reduction in the number of frames displayed, which can make gameplay appear less smooth.
Graphics processing unit (GPU) :: A processor designed to handle graphics and other highly parallel tasks.
Gaming PC :: A personal computer configured for playing video games.
Keyboard and mouse :: Common input devices for computer games.
Loading time :: The time needed for a game or level to load.
Platform :: The hardware or software environment on which a game runs.
Resolution scaling :: Adjusting the resolution at which a game is rendered to balance image quality and performance.
Solid-state drive (SSD) :: A storage device that uses flash memory and has no moving mechanical parts.
System requirements :: The minimum or recommended hardware and software needed to run a game.
Virtual reality (VR) :: Technology that creates an immersive, computer-generated environment.
Augmented reality (AR) :: Technology that adds digital elements to a view of the real world.
Central processing unit (CPU) :: The main processor that executes instructions and manages many computing tasks.
RAM :: Temporary working memory used by a computer while programs are running.
Storage :: The space used to save game files, programs and data.
## 12. Ethics, safety and responsible gaming
Age rating :: A classification that indicates the age group for which a game is considered suitable.
Bias :: A tendency that can lead to unfair or unbalanced decisions or representations.
Cyberbullying :: Bullying that takes place through digital communication or online platforms.
Cybersecurity :: Practices and technologies used to protect systems, networks and data from digital threats.
Data protection :: Rules and practices that protect personal information from misuse or unauthorized access.
Digital footprint :: The trail of information a person leaves through online activities.
Digital wellbeing :: The ability to use digital technology in a healthy and balanced way.
Dark pattern :: A design choice that manipulates users into doing something they might not otherwise choose.
Gaming addiction :: A commonly used term for problematic gaming; gaming disorder is the clinical term used in the WHO's diagnostic framework.
Gaming disorder :: A pattern of gaming behaviour involving impaired control, increasing priority given to gaming and continued gaming despite significant negative consequences.
Harassment :: Unwanted behaviour that intimidates, threatens or targets another person.
Inclusion :: Making sure people with different backgrounds and abilities can participate.
Loot box transparency :: Clear information about randomized rewards, their probabilities and associated costs.
Personal data :: Information that identifies or can be linked to an individual.
Privacy :: The right to control access to personal information.
Representation :: How people, identities and groups are portrayed in a game.
Responsible game design :: Designing games with attention to player safety, accessibility, fairness and wellbeing.
Screen time :: The amount of time spent using a screen-based device.
Stereotype :: An oversimplified or generalized belief about a group of people.
Toxic behaviour :: Abusive, hostile or deliberately disruptive behaviour toward other players.
## 13. Useful verbs for talking about game development
Animate :: To create movement in digital characters or objects.
Build :: To construct or assemble a game or software project.
Code :: To write computer instructions.
Collaborate :: To work with other people toward a shared goal.
Create :: To make something new.
Debug :: To find and fix errors in code.
Deploy :: To make a software product or version available for use.
Design :: To plan how something should look, work or feel.
Develop :: To create or improve a game or feature.
Evaluate :: To judge the quality, effectiveness or success of something.
Implement :: To put a design or feature into practice.
Integrate :: To combine different systems or components so they work together.
Iterate :: To repeat a process while making improvements.
Maintain :: To keep a game or system working correctly over time.
Monetize :: To generate revenue from a game or service.
Model :: To create a digital representation of a 3D object.
Optimize :: To improve performance or efficiency.
Patch :: To update software to fix or change something.
Prototype :: To create an early version to test an idea.
Refine :: To make small changes to improve quality.
Release :: To make a game available to the public.
Render :: To generate a visual image from digital data.
Script :: To write code that controls a specific action or behaviour.
Test :: To check whether something works correctly.
Troubleshoot :: To identify and solve a technical problem.
## 14. Professional communication: useful phrases
> These phrases are grouped by purpose rather than alphabetically because they are intended as practical language patterns.
# Describing a game
- The game is designed for a target audience of …
- The main objective is to …
- One of the key gameplay mechanics is …
- The player progresses by …
- The game stands out because …
# Explaining technical problems
- We identified a bug that caused …
- The problem occurred when …
- We reproduced the error by …
- We improved performance by …
- The latest patch fixes …
# Discussing design decisions
- We chose this art style because …
- The user interface is designed to …
- Our main design challenge was …
- Based on player feedback, we decided to …
- We made the game more accessible by …
# Working in a team
- I was responsible for …
- I collaborated with the programming team to …
- We divided the tasks according to …
- We had to meet a tight deadline.
- If I worked on this project again, I would …

if(!clr){clr=1;cmsg="";render();setTimeout(function(){if(clr){clr=0;if(view=="t")render()}},6000);return}
clr=0;cmsg="Deleting…";render();var n=subs.length;
Promise.all(subs.map(function(x){return DB.doc("submissions/"+x.id).delete()})).then(function(){subs=[];cmsg="Deleted "+n+" entries.";render()},function(e){cmsg="Could not delete: "+((e&&e.message)||e);render()})}
function tdash(){$("nav").innerHTML="";var h='<div class="card"><h2>Class progress</h2><p class="sub">'+subs.length+' pair/student(s) have started. Updates live. Red = wrong attempts before the correct answer.</p><button class="btn sec" id="cb" onclick="clearAll()">'+(clr?'⚠ Click again to delete ALL results':'🗑 Clear class data')+'</button> <span class="sub">'+esc(cmsg)+'</span></div>';
 subs.sort(function(a,b){return(b.t||0)-(a.t||0)});
 subs.forEach(function(x){var g=x.g||{},wr=0;Object.keys(x.tries||{}).forEach(function(k){wr+=x.tries[k]});
  h+='<div class="card"><b>'+esc(x.name||"(no name)")+'</b> with '+esc(x.partner||"?")+' · steps '+x.done+'/'+x.total+' · quiz '+(x.qz?"✓ confirmed":"not yet")+' · wrong attempts '+wr+' · game: '+esc(g.title||"not yet")+'<details><summary>Answers and game draft</summary>';
  S.forEach(function(s){s.q.forEach(function(q){var v=(x.v||{})[q.id];if(v==null||v==="")return;var t=(x.tries||{})[q.id];h+='<div class="q'+(x.ok&&x.ok[q.id]?" ok":"")+'"><span class="sub">'+esc(s.n)+': '+esc(q.q)+'</span><br>'+esc(v)+(t?' <span style="color:var(--bad)">('+t+' wrong)</span>':'')+'</div>'})});
  h+='<pre>'+esc("Policy card: "+(x.card>=0?CARDS[x.card]:"-")+"\nTitle: "+(g.title||"")+"\nPitch: "+(g.pitch||"")+"\nModel: "+(g.models||"")+"\nPEGI: "+(g.pegi||"")+"\nWhy: "+(g.why||"")+"\nParental controls: "+(g.pc||"")+"\nReport/block: "+(g.report||"")+"\nTeam: "+(g.team||""))+'</pre></details></div>'});
 $("main").innerHTML=h}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stepDone(i){var s=S[i];if(s.id=="start")return !!(st.g.name&&st.g.name.length>1);if(s.id=="quiz")return !!st.qz;if(s.id=="game")return gameOK();
return s.q.every(function(q){return st.ok[q.id]})}
function gameOK(){var g=st.g;return st.card>=0&&g.partner&&g.title&&g.pitch&&g.pegi&&(g.why||"").length>=20&&(g.models||"")!==""}
function unlocked(i){if(PV)return true;for(var k=0;k<i;k++)if(!stepDone(k))return false;return true}
function render(){
 updScore();
 if(view=="t"){tdash();return}
 if(!st.seen){$("nav").innerHTML="";$("main").innerHTML=landH();return}
 var n=0;S.forEach(function(s,i){if(stepDone(i))n++});$("fill").style.width=(n/S.length*100)+"%";
 $("nav").innerHTML='<button onclick="st.seen=0;save();render()">ℹ About</button>'+S.map(function(s,i){return '<button class="'+(i==st.cur?"on ":"")+(stepDone(i)?"done":"")+'" '+(unlocked(i)?"":"disabled")+' onclick="go('+i+')">'+esc(s.n)+'</button>'}).join("");
 var s=S[st.cur],h='<div class="card"><span class="tag">Step '+(st.cur+1)+' of '+S.length+' · '+(s.m?'about '+s.m+' min':'extra')+'</span>';
 if(s.id=="start")h+=startH();else if(s.id=="quiz")h+=quizH();else if(s.id=="game")h+=gameH();else if(s.id=="vocab")h+=vocH();else{
  h+='<h2>'+esc(s.n=="Level 1"||s.lvl?s.n+" mission":s.n)+'</h2><p>'+esc(s.intro)+'</p>';
  if(s.lvl)h+='<p><a class="btn sec" target="_blank" rel="noopener" href="'+SITE+s.lvl+'">Open '+esc(s.n)+' on the website ↗</a></p><p class="sub">Keep this tab open and switch back to answer. Hints: everything you need is on the page.</p>';
  s.q.forEach(function(q){h+=qH(q)});if(s.id=="policy")h+=NOTE;}
 h+='</div><div class="row"><button class="btn sec" onclick="go('+(st.cur-1)+')" '+(st.cur?"":"disabled")+'>← Back</button>';
 if(st.cur<S.length-1)h+='<span class="sub" id="hint"></span><button class="btn" id="nx" onclick="nextStep()">Next →</button>';
 else h+='<button class="btn" onclick="print()" '+(stepDone(st.cur)||PV?"":"disabled")+'>Save as PDF / print</button>';
 $("main").innerHTML=h+'</div>';
 if(s.id=="exit"&&stepDone(st.cur))$("main").insertAdjacentHTML("afterbegin",'<div class="card ok"><h2>Mission complete! ⭐ Your score: '+score()[0]+' / '+score()[1]+' ('+Math.round(score()[0]/score()[1]*100)+'%)</h2><p>The score gives one point for every question you answer correctly. Great work!</p></div>');
}
function go(i){if(i<0||i>=S.length||!unlocked(i))return;st.cur=i;save();render();scrollTo(0,0)}
function qH(q){var v=st.v[q.id]==null?"":st.v[q.id],ok=st.ok[q.id],c=ok?"ok":(st.tries[q.id]?"no":""),f="";
 if(q.t=="c")f='<select onchange="ans(\''+q.id+'\',this.value)"><option value="">Choose…</option>'+q.o.map(function(o){return'<option'+(o==v?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>';
 else if(q.t=="n")f='<input type="number" step="any" value="'+esc(v)+'" oninput="nchk(\''+q.id+'\',this.value)" onchange="ans(\''+q.id+'\',this.value)" placeholder="Type the number">';
 else f='<textarea oninput="txt(\''+q.id+'\',this.value,'+q.min+')" placeholder="Write at least a short sentence…">'+esc(v)+'</textarea>';
 var fb=ok?(q.t=="x"?"Saved ✓":"Correct ✓"):(st.tries[q.id]>=2?"Not quite. Hint: go back to the website and read this part again, slowly.":(st.tries[q.id]?"Not quite. Check the website and try again.":""));
 return '<div class="q '+c+'" id="q_'+q.id+'"><label>'+esc(q.q)+'</label>'+f+'<div class="fb">'+fb+'</div></div>'}
function H(s){var a=0xdeadbeef,b=0x41c6ce57,c;for(var i=0;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)}
function nn(v){var s=String(v).replace(/[\s\u00a0]/g,"").replace(/[.,](?=\d{3}(\D|$))/g,"").replace(",",".");return String(parseFloat(s))}
function chk(q,v){return q.t=="n"?H("n|"+nn(v))===q.h:H("c|"+v)===q.h}
function resetAll(){var b=$("rsb");if(!rsc){rsc=1;b.textContent="Click again to confirm reset";setTimeout(function(){rsc=0;b.textContent="Reset saved answers"},5000);return}rsc=0;b.textContent="Reset saved answers";st={cur:0,v:{},ok:{},tries:{},g:{},qz:0,card:-1,seen:0};save();view="s";render()}
function find(id){for(var i=0;i<S.length;i++)for(var j=0;j<S[i].q.length;j++)if(S[i].q[j].id==id)return S[i].q[j]}
function ans(id,val){var q=find(id);st.v[id]=val;if(val===""){return}
 var good=chk(q,val);
 if(good){st.ok[id]=1}else{st.ok[id]=0;st.tries[id]=(st.tries[id]||0)+1}
 save();render();var e=$("q_"+id);if(e)e.scrollIntoView({block:"center"})}
function nchk(id,val){var q=find(id);st.v[id]=val;if(st.ok[id]||!chk(q,val)){save();return}st.ok[id]=1;save();updScore();var e=$("q_"+id);e.className="q ok";e.querySelector(".fb").textContent="Correct ✓";var nx=$("nx");if(nx)nx.disabled=false;updNav();var d=0;S.forEach(function(s,i){if(stepDone(i))d++});$("fill").style.width=(d/S.length*100)+"%"}
function txt(id,val,min){st.v[id]=val;var was=st.ok[id];st.ok[id]=val.trim().length>=min?1:0;save();
 var fb=document.querySelector("#q_"+id+" .fb");if(fb)fb.textContent=st.ok[id]?"Saved ✓":"";$("q_"+id).className="q "+(st.ok[id]?"ok":"");
 if(was!=st.ok[id]){var nx=$("nx");if(nx)nx.disabled=false;document.querySelectorAll("nav button")[st.cur].className="on "+(stepDone(st.cur)?"done":"")}
 var done=0;S.forEach(function(s,i){if(stepDone(i))done++});$("fill").style.width=(done/S.length*100)+"%"}
function startH(){return '<h2>Welcome, game designer!</h2><p>You are a junior game designer at a European studio. Your teacher is away, so this page guides you through the whole mission:</p><ol><li>Warm up with a stat guessing game.</li><li>Explore all <b>four levels</b> of the Pixels to Policy website and answer the mission questions.</li><li>Take the quiz and send a <b>screenshot</b> to Barbara on Teams.</li><li>Think critically about who made the site.</li><li>Design a <b>draft game</b> in pairs.</li></ol><p class="sub">You complete the levels and the quiz on your own. Only the final game draft is done in a pair, so you will meet your partner at that step.</p><div class="q"><label>Your name</label><input type="text" id="nm" value="'+esc(st.g.name||"")+'" oninput="gset(\'name\',this.value);var b=$(\'nx\');if(b)b.disabled=false"></div><button class="btn" onclick="begin()" style="margin-top:8px">Start the mission →</button><div class="fb" id="sfb"></div>'}
function nextStep(){if(stepDone(st.cur)||PV){go(st.cur+1);return}var s=S[st.cur],q=s.q.filter(function(x){return !st.ok[x.id]})[0],m="";if(q){var e=$("q_"+q.id);if(e){e.scrollIntoView({block:"center"});e.className="q no";var f=e.querySelector(".fb");if(f&&!st.tries[q.id])f.textContent="Answer this question to continue."}m="Almost there: answer the highlighted question first."}else if(s.id=="start")m="Please type your name first.";else if(s.id=="quiz")m="Tick the box once you have done the quiz and sent your screenshot.";else if(s.id=="game")m="Fill in your partner, title, pitch, business model, PEGI rating and reasons (at least 20 characters), and draw a Policy Card.";var h=$("hint");if(h)h.textContent=m}
function begin(){if(!stepDone(0)&&!PV){$("sfb").textContent="Please type your name first.";return}go(1)}
function gset(k,v){st.g[k]=v;save()}
function quizH(){return '<h2>Quiz and screenshot</h2><p>You have finished the four levels. Now complete the quiz on your own.</p><ol><li><a class="btn sec" target="_blank" rel="noopener" href="'+QUIZ+'">Open the quiz ↗</a></li><li>Answer all questions.</li><li>When the results page appears, take a <b>screenshot that clearly shows your completion results</b>.</li><li>Send the screenshot to <b>Barbara</b> as a <b>private message on Teams</b>.</li></ol><p class="sub">Each student sends their own screenshot.</p><label class="chk"><input type="checkbox" '+(st.qz?"checked":"")+' onchange="st.qz=this.checked?1:0;save();render()"><span>I completed the quiz and sent my screenshot to Barbara on Teams.</span></label>'}
function gameH(){var g=st.g,h='<h2>Design your game</h2><p><b>Pair activity:</b> work with a partner and agree on one game idea. Your studio is pitching a new game for the European market. It must be fun, financially realistic and responsible towards minors. First draw your Policy Card. It is a design rule you must follow.</p>';
 h+='<button class="btn" onclick="draw()">'+(st.card<0?"🎲 Draw a Policy Card":"🎲 Draw again")+'</button>';
 if(st.card>=0)h+='<div class="pc">Policy Card '+(st.card+1)+': '+esc(CARDS[st.card])+'</div>';
 h+=gf("partner","Your partner’s name (you design this game as a pair)","t")+gf("title","Working title","t")+gf("pitch","One-sentence pitch: “A ___ game where you ___”","t")+
 gf("genre","Genre","t")+gs("platform","Platform",["Console","PC","Tablet","Handheld","Mobile","VR"])+gf("aud","Target audience (age range and why)","t")+
 gs("models","Business model",["One-time purchase","Subscription","Free to play","Early access","Game bundles","Episodic content"])+
 gf("content","Optional in-game content you would sell, if any (skins, levels, currency, battle pass…) and why","a")+
 gs("pegi","Your predicted PEGI rating",R)+gf("why","Why this rating? Give at least two reasons (descriptors, purchases, chat, play-by-appointment)","a")+
 '<div class="q"><label>Parental controls you support</label>'+["Age rating","Time limit","Online spending","Online interaction"].map(function(p){return'<label class="chk"><input type="checkbox" '+((g.pc||"").indexOf(p)>-1?"checked":"")+' onchange="pcs(\''+p+'\',this.checked)"><span>'+p+'</span></label>'}).join("")+'</div>'+
 gf("report","How can players report or block unwanted content?","a")+gf("team","Five job roles you would hire first (Technology, Design, Image & sound, Management, Publishing & support)","a")+
 '<div class="q '+(gameOK()?"ok":"")+'"><b>Self-check:</b> card drawn, title, pitch, business model, PEGI and reasons filled in.<div class="fb">'+(gameOK()?"Ready ✓":"")+'</div></div>';
 h+=NOTE;if(gameOK())h+='<button class="btn" onclick="cp()">Copy my draft</button> <span id="cpm" class="sub"></span><pre id="sum">'+esc(summ())+'</pre>';return h}
function gf(k,l,t){var v=esc(st.g[k]||"");return '<div class="q"><label>'+l+'</label>'+(t=="a"?'<textarea oninput="gin(\''+k+'\',this.value)">'+v+'</textarea>':'<input type="text" value="'+v+'" oninput="gin(\''+k+'\',this.value)">')+'</div>'}
function gs(k,l,o){return '<div class="q"><label>'+l+'</label><select onchange="gin(\''+k+'\',this.value,1)"><option value="">Choose…</option>'+o.map(function(x){return'<option'+(st.g[k]==x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div>'}
function gin(k,v,r){st.g[k]=v;save();if(r){render()}else{var nx=$("nx");if(nx)nx.disabled=false;if(gameOK()!=!!$("sum"))render();else if($("sum"))$("sum").textContent=summ();updNav()}}
function updNav(){var b=document.querySelectorAll("nav button");if(b[st.cur])b[st.cur].className="on "+(stepDone(st.cur)?"done":"")}
function pcs(p,on){var a=(st.g.pc||"").split(",").filter(Boolean);a=a.filter(function(x){return x!=p});if(on)a.push(p);st.g.pc=a.join(",");save();if($("sum"))$("sum").textContent=summ()}
function draw(){var n;do{n=Math.floor(Math.random()*CARDS.length)}while(n==st.card&&CARDS.length>1);st.card=n;save();render()}
function summ(){var g=st.g;return "GAME DRAFT by "+(g.name||"?")+" and "+(g.partner||"?")+"\nTitle: "+(g.title||"")+"\nPitch: "+(g.pitch||"")+"\nGenre / platform: "+(g.genre||"")+" / "+(g.platform||"")+"\nAudience: "+(g.aud||"")+"\nPolicy Card: "+(st.card>=0?CARDS[st.card]:"")+"\nBusiness model: "+(g.models||"")+"\nOptional content: "+(g.content||"")+"\nPredicted PEGI: "+(g.pegi||"")+"\nWhy: "+(g.why||"")+"\nParental controls: "+(g.pc||"")+"\nReport/block: "+(g.report||"")+"\nTeam: "+(g.team||"")}
function cp(){var m=$("cpm");try{navigator.clipboard.writeText(summ()).then(function(){m.textContent="Copied!"},function(){m.textContent="Select the text below and copy it."})}catch(e){m.textContent="Select the text below and copy it."}}
render();
if(PV){$("pvb").style.display="inline-block";$("rsb").style.display="inline-block";$("pvb").textContent="Preview mode ON (click to lock again)"}
(async function(){try{var u=await claude.use("user"),db=await claude.use("db");if(u&&db){UID=await u.id();DB=db;OWN=u.canEdit();if(OWN){$("tb").style.display="inline-block";$("pvb").style.display="inline-block"}sync()}}catch(e){}})();
</script></body></html>
